# Build `thetowersdk.wasm` and attach it to a release.
#
# The module is ~6.6 MB, against an npm tarball of ~3.6 MB, and the people it is FOR do not use
# npm — they are writing Python, Rust, Go or C#. So it ships as a release asset rather than inside
# the package: a JavaScript caller pays nothing for it, and everyone else downloads one file.
#
# Runs for every release, and on demand. Not on every push: nothing in CI consumes the module, and
# building it on each commit spends several minutes producing an artifact nobody reads.
name: WASM

on:
  # Called by release.yml with the tag it just created. That is the path a normal release takes:
  # a release made with the Actions token does not fire `on: release` here.
  workflow_call:
    inputs:
      tag:
        description: The release tag to build from and attach the module to.
        required: true
        type: string
  # A release published by hand, from the GitHub UI or `gh release create`.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The release's own tag when called with one; otherwise whatever triggered the run.
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The module is compiled from `dist`, so a stale dist means a module that answers with
      # yesterday's numbers. Build it here rather than trusting whatever is checked out.
      - run: pnpm build

      - run: pnpm wasm:build

      # The parity suite is the point of the whole exercise: a WASM build that disagrees with the
      # library is the drift this exists to prevent. Publishing one that fails would be worse than
      # publishing none.
      - run: pnpm exec vitest run wasm/

      - name: Attach to the release
        if: inputs.tag != '' || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" wasm/.build/thetowersdk.wasm --clobber

      - name: Keep it as a build artifact otherwise
        if: inputs.tag == '' && github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: thetowersdk-wasm
          path: wasm/.build/thetowersdk.wasm
