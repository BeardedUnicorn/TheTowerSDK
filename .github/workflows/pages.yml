name: github-pages

# The documentation site lives in `site/` in this repository, and is published to
# https://tmrxjd.github.io/TheTowerSDK/.
#
# It used to be its own repository, TheTowerSDK-site, which is where the trailing `-site` in
# the old URL came from — GitHub Pages names the path after the repository. Folding the site
# in here is what removes it.
#
# `BASE_PATH` is derived from the repository name rather than hard-coded, so the site keeps
# working if the repository is ever renamed, and so a fork publishes under its own name
# instead of 404ing on assets it expects at /TheTowerSDK/.
#
# One-time setup, which cannot be done from a workflow:
#   Settings → Pages → Build and deployment → Source: **GitHub Actions**.
#   Until that is set, this workflow runs green and publishes nothing.

on:
  push:
    branches: [main]
    # Examples and catalog pages consume the SDK in this checkout.
    paths:
      - 'site/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/copy-assets.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version pinned by `packageManager` in the root package.json. An
      # action's inputs are resolved against the repository root, not `working-directory`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # Two projects, two lockfiles: the SDK at the root and the site in `site/`.
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml
      - name: Install SDK dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      # The site depends on the SDK as `link:..`, so it reads this build, not a published one.
      - name: Build the SDK used by the site
        run: pnpm build
        working-directory: .
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v5
        with:
          # Not affected by `defaults.run.working-directory`, which only applies to `run`
          # steps — an action's inputs are resolved against the repository root.
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
