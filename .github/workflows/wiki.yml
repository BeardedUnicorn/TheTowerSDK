name: Publish wiki

# The GitHub wiki is a separate repository (`<repo>.wiki.git`) that is not versioned with
# the code and not reviewed in a pull request. Everything in it is generated from this
# repo by `scripts/build-wiki.mjs`, so it cannot drift from the README and docs — and every
# page says so. Do not edit pages in the wiki UI; they are overwritten on the next push.
#
# One-time setup before this can run:
#   1. Enable the wiki in Settings → Features, and create any page once in the UI. The
#      `.wiki.git` repository does not exist until a first page is saved, and cloning it
#      before then fails with "repository not found".
#   2. Add a secret `WIKI_TOKEN`: a **classic** PAT with the `repo` scope.
#      Two traps here. The built-in GITHUB_TOKEN cannot push to a wiki repository at all.
#      And a fine-grained PAT is not a substitute: wiki (`.wiki.git`) access is not covered
#      by its Contents permission, so it authenticates against the code repo and still fails
#      against the wiki. Verify before trusting CI:
#        git clone https://<token>@github.com/BeardedUnicorn/TheTowerSDK.wiki.git

# Runs after every release, and on demand. `release.yml` calls it with the tag it just created,
# so the wiki describes the version that was published. It is not triggered by `on: release`: a
# release made with the Actions token does not fire that event in another workflow.
#
# A docs-only commit does not release, so it reaches the wiki with the next release — or sooner
# by running this by hand, or with `pnpm wiki:publish` from a machine that can already push.
#
# Without WIKI_TOKEN a release run skips the wiki with a warning rather than failing: the npm
# version is already published by then and cannot be taken back, and a check that is always red
# teaches people to ignore the ones that matter. A run started by hand fails instead, because
# publishing the wiki is the only thing it was asked to do.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to generate the wiki from.
        required: true
        type: string
    secrets:
      WIKI_TOKEN:
        required: false
  workflow_dispatch:

# Two pushes racing would fight over the same wiki repo.
concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # The release's own tag when called with one; otherwise whatever triggered the run.
          ref: ${{ inputs.tag || github.ref }}

      - name: Check for the wiki token
        id: token
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          FROM_RELEASE: ${{ inputs.tag != '' }}
        run: |
          if [ -n "$WIKI_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$FROM_RELEASE" = "true" ]; then
            echo "::warning::WIKI_TOKEN is not set, so the wiki was not updated for this release. See the header of wiki.yml for setup."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "WIKI_TOKEN is not set — see the header of this workflow for setup." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v7
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24
          cache: pnpm

      # The game pages are read from the built package, so the wiki needs a build first.
      - name: Build the package
        if: steps.token.outputs.present == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Render the wiki
        if: steps.token.outputs.present == 'true'
        run: node scripts/build-wiki.mjs --out "$RUNNER_TEMP/wiki-pages"

      - name: Clone the wiki repository
        if: steps.token.outputs.present == 'true'
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            "$RUNNER_TEMP/wiki-repo"

      - name: Sync pages
        if: steps.token.outputs.present == 'true'
        run: |
          cd "$RUNNER_TEMP/wiki-repo"
          # Delete tracked pages first so a removed source file removes its page too;
          # copying over the top would leave orphans behind forever.
          git rm -rq --ignore-unmatch '*.md'
          cp "$RUNNER_TEMP"/wiki-pages/*.md .
          git add -A

      - name: Commit and push
        if: steps.token.outputs.present == 'true'
        run: |
          # The commit that was checked out, which for a release is the tag, not GITHUB_SHA.
          source_sha=$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)
          cd "$RUNNER_TEMP/wiki-repo"
          if git diff --cached --quiet; then
            echo "Wiki already matches the sources; nothing to push."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Regenerate wiki from ${source_sha}"
          git push origin HEAD
